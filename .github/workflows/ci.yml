name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.11.1
          - 24
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate source and generated assets
        run: npm run check
      - name: Build deterministic extension archive
        run: |
          npm run package
          cp dist/fsrcnnx-ext.zip /tmp/fsrcnnx-ext-first.zip
          npm run package
          cmp /tmp/fsrcnnx-ext-first.zip dist/fsrcnnx-ext.zip
          unzip -t dist/fsrcnnx-ext.zip
