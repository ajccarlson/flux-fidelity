name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-reproduction:
    name: Reproduce RIFE FP16 model
    runs-on: ubuntu-latest
    container:
      image: python@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reproduce and verify FP16 model
        run: sh tools/model-reproduction/check-rife-fp16.sh

  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.11.1
          - 24
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate source and generated assets
        run: npm run check
      - name: Build deterministic extension archive
        run: |
          npm run package:internal
          cp dist/fsrcnnx-ext.zip /tmp/fsrcnnx-ext-first.zip
          npm run package:internal
          cmp /tmp/fsrcnnx-ext-first.zip dist/fsrcnnx-ext.zip
          unzip -t dist/fsrcnnx-ext.zip

  browser-integration:
    name: Validate packaged extension in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FSRCNNX_BROWSER: google-chrome
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.11.1
      - name: Verify browser prerequisites
        run: |
          google-chrome --version
          xvfb-run --help >/dev/null
      - name: Build packaged extension
        run: npm run package:internal
      - name: Validate packaged extension
        run: timeout --signal=TERM --kill-after=15s 8m xvfb-run -a npm run validate:browser -- --extension-root dist/fsrcnnx-ext
