name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-reproduction:
    name: Reproduce RIFE FP16 model
    runs-on: ubuntu-latest
    container:
      image: python@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproduce and verify FP16 model
        run: sh tools/model-reproduction/check-rife-fp16.sh

  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.11.1
          - 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate source and generated assets
        run: npm run check
      - name: Build deterministic extension archive
        run: |
          npm run package:internal
          cp dist/flux-fidelity-*.zip /tmp/flux-fidelity-first.zip
          npm run package:internal
          cmp /tmp/flux-fidelity-first.zip dist/flux-fidelity-*.zip
          unzip -t dist/flux-fidelity-*.zip

  browser-integration:
    name: Validate packaged extension in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FSRCNNX_BROWSER: chromium
      # Chromium runs under SwiftShader on an unpinned runner image here, so every
      # wait is far slower than locally. Scaling the harness budgets is what makes
      # the fixed local defaults appropriate for CI without retuning each one.
      FSRCNNX_TIMEOUT_SCALE: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.11.1
      - name: Verify browser prerequisites
        run: |
          "$FSRCNNX_BROWSER" --version
          chromium_path="$(readlink -f "$(command -v "$FSRCNNX_BROWSER")")"
          test -x "$chromium_path"
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            '' \
            "profile fsrcnnx-chromium-ci $chromium_path flags=(unconfined) {" \
            '  userns,' \
            '}' \
            | sudo tee /etc/apparmor.d/fsrcnnx-chromium-ci >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/fsrcnnx-chromium-ci
          sudo apparmor_status | grep -F 'fsrcnnx-chromium-ci'
          xvfb-run --help >/dev/null
      - name: Build packaged extension
        run: npm run package:internal
      - name: Validate packaged extension
        run: timeout --signal=TERM --kill-after=15s 8m xvfb-run -a npm run validate:browser -- --extension-root dist/flux-fidelity --neural-model-key cda-vsr-4x --require-temporal-neural-runs --allow-neural-f16-unavailable
