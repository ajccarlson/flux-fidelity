<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="0.55" stop-color="#33b5e5"/>
      <stop offset="1" stop-color="#5af0e0"/>
    </linearGradient>
    <clipPath id="rounded"><rect x="0" y="0" width="128" height="128" rx="26"/></clipPath>
    <clipPath id="leftHalf"><rect x="0" y="0" width="62" height="128"/></clipPath>
    <clipPath id="rightHalf"><rect x="62" y="0" width="66" height="128"/></clipPath>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="128" height="128" fill="url(#bg)"/>

    <!-- LEFT (blurry, dimmer) half -->
    <g clip-path="url(#leftHalf)" opacity="0.78">
      <g filter="url(#blur)">
        <rect x="24" y="34" width="80" height="60" rx="13" fill="none" stroke="url(#grad)" stroke-width="7"/>
        <path d="M54 49 L80 64 L54 79 Z" fill="url(#grad)"/>
      </g>
    </g>

    <!-- RIGHT (sharp, full brightness) half -->
    <g clip-path="url(#rightHalf)">
      <rect x="24" y="34" width="80" height="60" rx="13" fill="none" stroke="url(#grad)" stroke-width="7"/>
      <path d="M54 49 L80 64 L54 79 Z" fill="url(#grad)"/>
    </g>
  </g>
</svg>
